[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sharkrail"
version = "0.0.1"
description = "Native execution rails for AI agents"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "GPL-3.0"}
dependencies = [
    "pywinpty>=3.0.0; sys_platform == 'win32'",
]

[project.scripts]
sharkrail = "sharkrail.cli:main"

[project.urls]
Source = "https://github.com/imlarrychen/SharkRail"

[tool.ruff]
target-version = "py39"
lint.ignore = ["UP045"]

[tool.pytest.ini_options]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]

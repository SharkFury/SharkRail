[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sharkrail"
version = "0.1.0"
description = "Verifiable process execution for AI agents"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["ai-agents", "automation", "conpty", "process", "pty", "terminal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Shells",
]
dependencies = [
    "pywinpty>=3.0.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = [
    "hypothesis>=6.120,<7",
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-timeout>=2.3",
    "ruff>=0.11",
    "mypy>=1.15,<3",
]
observability = [
    "opentelemetry-api>=1.31,<1.42; python_version < '3.10'",
    "opentelemetry-api>=1.31; python_version >= '3.10'",
]

[project.scripts]
sharkrail = "sharkrail.cli:main"

[project.urls]
Changelog = "https://github.com/SharkFury/SharkRail/blob/main/CHANGELOG.md"
Documentation = "https://github.com/SharkFury/SharkRail/tree/main/docs"
Issues = "https://github.com/SharkFury/SharkRail/issues"
Source = "https://github.com/SharkFury/SharkRail"

[tool.ruff]
target-version = "py39"
lint.ignore = ["UP045"]

[tool.mypy]
python_version = "3.9"
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sharkrail = ["py.typed", "schemas/*.json"]

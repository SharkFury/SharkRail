name: ci

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install ruff
      - run: ruff check src tests .github/scripts

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest build
          pip check
      - name: Run tests
        if: runner.os != 'Windows'
        run: pytest
      - name: Test Windows capabilities
        if: runner.os == 'Windows' && always()
        run: pytest tests/test_capabilities.py
      - name: Test Windows doctor
        if: runner.os == 'Windows' && always()
        run: pytest tests/test_doctor.py
      - name: Diagnose Windows runtime
        if: runner.os == 'Windows' && always()
        shell: pwsh
        run: |
          $report = python -m sharkrail doctor --json
          if ($LASTEXITCODE -ne 0) {
            $message = ($report -join " ").Replace("%", "%25")
            Write-Output "::error title=Windows doctor diagnostics::$message"
            exit 1
          }
      - name: Test Windows lifecycle model
        if: runner.os == 'Windows' && always()
        run: pytest tests/test_lifecycle.py
      - name: Test Windows command models
        if: runner.os == 'Windows' && always()
        run: pytest tests/test_models.py
      - name: Test Windows output capture
        if: runner.os == 'Windows' && always()
        run: pytest tests/test_output.py
      - name: Test Windows public API
        if: runner.os == 'Windows' && always()
        run: pytest tests/test_public_api.py
      - name: Test Windows routing
        if: runner.os == 'Windows' && always()
        run: pytest tests/test_routing.py
      - name: Test Windows platform adapters
        if: runner.os == 'Windows' && always()
        run: pytest tests/test_windows.py
      - name: Test Windows pipe stdin
        if: runner.os == 'Windows' && always()
        run: pytest tests/test_backends.py -k supports_stdin
      - name: Test Windows pipe wait and kill
        if: runner.os == 'Windows' && always()
        run: pytest tests/test_backends.py -k wait_for_exit
      - name: Test Windows pipe forced cancel
        if: runner.os == 'Windows' && always()
        run: pytest tests/test_backends.py -k skip_soft_interrupt
      - name: Test Windows pipe environment
        if: runner.os == 'Windows' && always()
        run: pytest tests/test_backends.py -k environment_is_an_overlay
      - name: Test Windows command runner
        if: runner.os == 'Windows' && always()
        run: pytest tests/test_executor.py
      - name: Test Windows lifecycle events
        if: runner.os == 'Windows' && always()
        run: pytest tests/test_lifecycle_events.py
      - name: Test Windows session core
        if: runner.os == 'Windows' && always()
        run: pytest tests/test_sessions.py -k "not persistent_pty"
      - name: Test Windows protocol
        if: runner.os == 'Windows' && always()
        run: pytest tests/test_protocol.py
      - name: Test Windows ConPTY
        if: runner.os == 'Windows' && always()
        run: pytest tests/test_sessions.py -k persistent_pty
      - name: Test Windows CLI
        if: runner.os == 'Windows' && always()
        run: pytest tests/test_cli.py tests/test_pty_backend.py
      - name: Test Windows reliability stress
        if: runner.os == 'Windows' && always()
        run: pytest tests/test_reliability.py
      - name: Run compatibility smoke checks
        run: |
          python -m compileall src tests
          python .github/scripts/compat_smoke.py
      - name: Assert CLI capability contract
        run: |
          python -m sharkrail capabilities --json
      - name: Build distributions
        run: python -m build

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --editable ".[test]"
      - name: Enforce coverage and test deadlines
        run: >-
          pytest
          --timeout=20
          --cov=sharkrail
          --cov-report=term-missing
          --cov-fail-under=70

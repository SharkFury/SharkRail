name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install ruff
      - run: ruff check src tests .github/scripts

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest build
      - name: Run tests
        if: runner.os != 'Windows'
        run: pytest
      - name: Test Windows core contracts
        if: runner.os == 'Windows'
        run: pytest tests/test_capabilities.py tests/test_doctor.py tests/test_lifecycle.py tests/test_models.py tests/test_output.py tests/test_public_api.py tests/test_routing.py tests/test_windows.py
      - name: Test Windows pipe stdin
        if: runner.os == 'Windows'
        run: pytest tests/test_backends.py -k supports_stdin
      - name: Test Windows pipe wait and kill
        if: runner.os == 'Windows'
        run: pytest tests/test_backends.py -k wait_for_exit
      - name: Test Windows pipe forced cancel
        if: runner.os == 'Windows'
        run: pytest tests/test_backends.py -k skip_soft_interrupt
      - name: Test Windows pipe environment
        if: runner.os == 'Windows'
        run: pytest tests/test_backends.py -k environment_is_an_overlay
      - name: Test Windows command runner
        if: runner.os == 'Windows'
        run: pytest tests/test_executor.py
      - name: Test Windows lifecycle events
        if: runner.os == 'Windows'
        run: pytest tests/test_lifecycle_events.py
      - name: Test Windows session core
        if: runner.os == 'Windows'
        run: pytest tests/test_sessions.py -k "not persistent_pty"
      - name: Test Windows protocol
        if: runner.os == 'Windows'
        run: pytest tests/test_protocol.py
      - name: Test Windows ConPTY
        if: runner.os == 'Windows'
        run: pytest tests/test_sessions.py -k persistent_pty
      - name: Test Windows CLI
        if: runner.os == 'Windows'
        run: pytest tests/test_cli.py tests/test_pty_backend.py
      - name: Run compatibility smoke checks
        run: |
          python -m compileall src tests
          python .github/scripts/compat_smoke.py
      - name: Assert CLI capability contract
        run: |
          python -m sharkrail capabilities --json
      - name: Build distributions
        run: python -m build

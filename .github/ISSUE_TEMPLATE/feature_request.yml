name: Feature request
description: Propose a concrete agent execution use case
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What agent or automation failure cannot be handled reliably today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior rather than only an implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing workarounds, libraries, or platform APIs you evaluated.
  - type: dropdown
    id: platforms
    attributes:
      label: Platforms
      multiple: true
      options:
        - Windows
        - Linux
        - macOS
        - WSL
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Contract impact
      description: Note expected API, protocol, lifecycle, security, or observability changes.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and the roadmap.
          required: true
        - label: I described a concrete use case and observable outcome.
          required: true
